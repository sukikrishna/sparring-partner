[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparring-partner"
version = "0.2.0"
description = "A human-AI negotiation preparation tool that keeps human strategy and AI synthesis separate and grounds every AI insight in case documents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["anthropic>=2.0", "pymupdf>=1.24", "pytest>=8", "httpx>=0.27"]

[project.scripts]
sparring-partner = "sparring_partner.cli:main"

[tool.setuptools.packages.find]
include = ["sparring_partner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
