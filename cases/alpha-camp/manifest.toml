id = "alpha-camp"
title = "Alpha: food access at the refugee camp"
summary = """
After unrest in Omega, refugees have poured into neighbouring Alpha; the largest camp holds about \
160,000 people guarded by about 700 militia-linked guards. Food Without Borders (FWB) needs the Camp \
Commander's agreement to distribute food, while the Commander faces unpaid guards, a suspicious \
government and pressure to keep the camp under control.
"""
source_root = "Cases/Simulation 2"

[[roles]]
id = "fwb"
name = "FWB delegate"
counterpart = "Camp Commander"
brief = """
You are the newly arrived Food Without Borders (FWB) delegate for Northern Alpha. You must secure \
the Camp Commander's agreement to distribute food in Alpha's largest refugee camp. Your Country \
Director has set FWB's neutrality as a red line: no direct transfer of food or resources to anyone \
linked to security structures. Messages from your director, local contacts and officials are in \
your documents.
"""

[[roles]]
id = "commander"
name = "Camp Commander"
counterpart = "FWB delegate"
brief = """
You command Alpha's largest refugee camp: about 160,000 refugees from Omega and about 700 guards \
drawn from local militias, many of them unpaid. A new FWB delegate wants access to distribute food. \
Your role card and the messages you have received are in your documents.
"""

