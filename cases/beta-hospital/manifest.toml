id = "beta-hospital"
title = "Beta: detained surgical staff"
summary = """
Health for All (HfA), an international medical NGO, decided with little local consultation to close \
its surgical unit at a rural district hospital in Beta and move the team to a war zone elsewhere. \
Local armed tribesmen have confined nine international staff to their residence. A delegation from \
HfA headquarters must negotiate with the tribal leaders for the staff's safe release.
"""
source_root = "Cases/Simulation 1"

[[roles]]
id = "hfa"
name = "HfA delegation"
counterpart = "Tribal council"
brief = """
You lead the Health for All delegation sent from Geneva to Iguwafe, where tribesmen have confined \
nine of your international surgical staff to their residence after HfA announced it was closing its \
surgical operations. HfA has a strict no-ransom policy and its main donors want the team redeployed. \
You have met many local and international actors; their accounts are in your documents. Next, you \
negotiate with the tribal leaders.
"""

[[roles]]
id = "tribal-council"
name = "Tribal council"
counterpart = "HfA delegation"
brief = """
You speak for the tribal leadership of Beta Town, whose people have confined nine HfA surgeons to \
their residence after HfA announced, without consulting you, that it would close the surgical unit \
at the district hospital. Your documents include press coverage and reports passed to you by \
informants about HfA's meetings.
"""

[[documents]]
id = "hfa-case"
title = "HfA case packet"
kind = "Meeting report"
visible_to = ["hfa"]
source = "OriginalCase.docx"
split = "numbered-sources"

