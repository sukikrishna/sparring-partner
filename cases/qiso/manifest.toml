id = "qiso"
title = "Qiso: refugees at the border town"
summary = """
Several thousand people have fled from Chiasa into Qiso, a farming town on Sitwan's border. \
Many come from Kiman, whose families have worked Qiso's almond and pecan harvest for generations. \
The national Border Authority wants every Chiasan in Qiso gathered in the municipal stadium and \
transferred to Refugee Detention Facilities within two weeks, and has sent an officer to agree a \
plan with the Mayor.
"""
source_root = "Cases/Final"

# Visibility rule used below: files in a role's own folder are visible to that
# role only; files in either "Shared" folder are visible to both roles.

[[roles]]
id = "mayor"
name = "Mayor of Qiso"
counterpart = "Officer of the Border Authority"
starter_notes_file = "mayor_notes.txt"
brief = """
You are the Mayor of Qiso, a farming town on Sitwan's eastern border with Chiasa. Several thousand \
people from Chiasa, many of them from the neighbouring town of Kiman, have fled into Qiso. The \
Border Authority has written that your police must gather every Chiasan in the municipal stadium so \
they can be registered and bussed to Refugee Detention Facilities (RDFs). An officer of the Border \
Authority arrives this week to agree a timeline with you. Messages from your residents, farmers, \
churches, school, police chief and finance department are in your documents.
"""

[[roles]]
id = "border-officer"
name = "Border Authority officer"
counterpart = "Mayor of Qiso"
brief = """
You are an officer of Sitwan's Border Authority, sent to Qiso to work with the Mayor to register \
the Chiasans in the town and transfer them to Refugee Detention Facilities within two weeks. Your \
role card and your instructions from headquarters are in your documents.
"""

